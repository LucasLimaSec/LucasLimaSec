# Gera a cobrinha que "come" o gráfico de contribuições e publica na branch `output`.
name: Cobrinha de contribuições

on:
  schedule:
    - cron: "0 */12 * * *" # a cada 12 horas
  workflow_dispatch: # permite rodar manualmente pela aba Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#556340&color_dots=#ebedf0,#d8eeb0,#b5dc72,#8fb04a,#556340
            dist/snake-dark.svg?palette=github-dark&color_snake=#C5F06A&color_dots=#161b22,#2c3a14,#556340,#8fb04a,#C5F06A

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
